name: Bug report
description: Report reproducible behavior that differs from what you expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve VS Journal. Provide enough detail to reproduce the problem.

  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: Briefly describe the problem and its impact.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what happened instead, including exact error messages.
    validations:
      required: true

  - type: input
    id: extension_version
    attributes:
      label: VS Journal version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your VS Code version, operating system, and any relevant workspace details.
      placeholder: "VS Code 1.XX.X; Windows 11"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add relevant logs, screenshots, links, or sample journal data.
