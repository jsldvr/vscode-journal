name: Chore
description: Propose maintenance, tooling, documentation, or internal work.
title: "[Chore]: "
labels:
  - chore
body:
  - type: markdown
    attributes:
      value: Describe the maintenance outcome without expanding the task into unrelated work.

  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work that needs to be completed.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain why this maintenance work is needed now.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions that define completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add relevant links, constraints, examples, or prior decisions.
